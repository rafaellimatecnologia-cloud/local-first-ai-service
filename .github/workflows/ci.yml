name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: trojan source guard
        run: python tools/check_bidi.py
      - name: lint
        run: ruff check .
      - name: format
        run: ruff format --check .
      - name: typecheck
        run: pyright
      - name: test
        run: |
          pytest -q --cov=local_first_ai_service --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov
